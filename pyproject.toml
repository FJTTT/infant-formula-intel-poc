[project]
name = "infant-formula-intel-poc"
version = "0.1.0"
description = "Local PoC for infant formula competitive marketing intelligence backfill."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "feedparser>=6.0.11",
  "pandas>=2.2.2",
  "python-dateutil>=2.9.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "streamlit>=1.37.0",
  "pytest>=8.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


